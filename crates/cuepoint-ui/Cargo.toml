[package]
name = "cuepoint-ui"
description = "egui widgets and panels: decks, waveforms, browser, mixer, preferences."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
cuepoint-core = { path = "../cuepoint-core" }
cuepoint-engine = { path = "../cuepoint-engine", default-features = false }
cuepoint-library = { path = "../cuepoint-library", default-features = false }
egui = "0.37"
egui_extras = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[lints]
workspace = true
